[project]
name = "ec-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.0.0,<5.0",
  "chromadb>=0.5.0",
  "fastapi>=0.115.0",
  "langchain>=0.3.0",
  "langchain-ollama>=0.2.0",
  "langgraph>=0.2.0",
  "llama-index>=0.12.0",
  "llama-index-vector-stores-chroma>=0.3.0",
  "passlib>=1.7.4",
  "pydantic[email]>=2.0.0",
  "pydantic-settings>=2.6.0",
  "python-jose>=3.3.0",
  "sqlalchemy>=2.0.0",
  "sse-starlette>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
