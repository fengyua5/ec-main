[project]
name = "ec-backend"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "bcrypt>=4.0.0",
  "fastapi>=0.115.0",
  "passlib>=1.7.4",
  "pydantic[email]>=2.0.0",
  "pydantic-settings>=2.6.0",
  "python-jose>=3.3.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
